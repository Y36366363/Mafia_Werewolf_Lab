[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mafia-werewolf-lab"
version = "0.1.0"
description = "Reproducible hidden-role game experiments with explicit information boundaries"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
analysis = ["scipy>=1.10"]

[project.scripts]
mafia-lab = "mafia_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["mafia_lab*"]
